<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent Successfully | Rasheed Ibrahim</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Reuse your main stylesheet to keep dark theme matching -->
    <link rel="stylesheet" href="style.css">
    <style>
        .success-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            background: var(--bg);
        }
        .success-card {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 50px 40px;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .success-icon {
            font-size: 4rem;
            color: #27c93f;
            margin-bottom: 25px;
        }
        .success-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }
        .success-card p {
            color: var(--text-light);
            font-size: 1.05rem;
            margin-bottom: 35px;
        }
    </style>
</head>

<body>
    <main class="success-wrapper">
        <div class="success-card">
            <div class="success-icon">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1>Message Sent!</h1>
            <p>Thank you for reaching out, Rasheed. Your message has been safely received, and I will get back to you shortly via email or WhatsApp.</p>
